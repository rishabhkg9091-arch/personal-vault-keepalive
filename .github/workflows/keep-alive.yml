name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 9 * * *'  # Every day at 9:00 AM UTC
  workflow_dispatch:      # Allow manual trigger anytime

# Give the workflow write permission to commit the keep-alive log
permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    name: Ping Supabase + commit log to stay alive forever

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ping Supabase REST API
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            "https://neoefvajzpmicfaozvlg.supabase.co/rest/v1/vault_items?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Supabase ping HTTP status: $RESPONSE"

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 500 ]; then
            echo "Supabase is alive and responding."
          else
            echo "ERROR: Unexpected response code $RESPONSE"
            exit 1
          fi

      - name: Commit daily keep-alive log (prevents GitHub disabling this workflow)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .keepalive
          echo "Last ping: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .keepalive/last-ping.txt
          git add .keepalive/last-ping.txt
          git commit -m "chore: keep-alive ping $(date -u '+%Y-%m-%d')" || echo "Nothing to commit"
          git push
