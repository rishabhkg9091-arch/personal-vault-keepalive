name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 9 */2 * *'  # Every 2 days at 9:00 AM UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    name: Ping Supabase to prevent pausing

    steps:
      - name: Ping Supabase REST API
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            "https://neoefvajzpmicfaozvlg.supabase.co/rest/v1/vault_items?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Supabase ping HTTP status: $RESPONSE"

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 500 ]; then
            echo "Supabase is alive and responding."
          else
            echo "WARNING: Unexpected response code $RESPONSE"
            exit 1
          fi
